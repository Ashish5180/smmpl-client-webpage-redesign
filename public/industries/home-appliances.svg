<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="applLightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fc" />
      <stop offset="50%" stop-color="#f0f3f8" />
      <stop offset="100%" stop-color="#e4e8f0" />
    </linearGradient>
    <pattern id="applLightGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#000000" stroke-opacity="0.04" stroke-width="1" />
      <circle cx="0" cy="0" r="1" fill="#000000" fill-opacity="0.08" />
    </pattern>
    <linearGradient id="metalBezelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dce1ec" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="1000" fill="url(#applLightBg)" />
  <rect width="800" height="1000" fill="url(#applLightGrid)" />

  <!-- Technical Top Header -->
  <g transform="translate(50, 70)">
    <text x="0" y="0" fill="#E03A2B" font-family="monospace" font-size="12" font-weight="600" letter-spacing="0.1em">SECTOR: APPL-02 // CONSUMER DURABLES</text>
    <text x="700" y="0" text-anchor="end" fill="#6b6b70" font-family="monospace" font-size="11">CLASS-A INJECTION</text>
    <line x1="0" y1="16" x2="700" y2="16" stroke="#000000" stroke-opacity="0.08" stroke-width="1" />
  </g>

  <!-- Engineering Appliance Enclosure Wireframe (Washing Machine / Refrigerator / AC Bezel Tooling) -->
  <g transform="translate(400, 480)">
    <!-- Aerodynamic Front Bezel Outer Frame -->
    <rect x="-240" y="-180" width="480" height="380" rx="32" fill="url(#metalBezelLight)" stroke="#1a1c22" stroke-opacity="0.25" stroke-width="2" />
    
    <!-- Recessed Control Display Pocket (High-Gloss Mirror Finish Core) -->
    <rect x="-180" y="-130" width="360" height="130" rx="16" fill="#f4f6fa" stroke="#E03A2B" stroke-width="1.5" />
    
    <!-- Rotary Dial Mold Cavity Ring -->
    <circle cx="100" cy="-65" r="42" fill="#ffffff" stroke="#1a1c22" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="100" cy="-65" r="30" fill="#f4f6fa" stroke="#E03A2B" stroke-width="1.5" />
    <circle cx="100" cy="-65" r="8" fill="#E03A2B" />

    <!-- Capacitive Touch Key Cavity Pockets -->
    <rect x="-140" y="-85" width="40" height="40" rx="8" fill="#ffffff" stroke="#1a1c22" stroke-opacity="0.2" />
    <rect x="-85" y="-85" width="40" height="40" rx="8" fill="#ffffff" stroke="#1a1c22" stroke-opacity="0.2" />
    <rect x="-30" y="-85" width="40" height="40" rx="8" fill="#ffffff" stroke="#1a1c22" stroke-opacity="0.2" />

    <!-- Louvered Airflow Vents & Internal Rib Network -->
    <g stroke="#1a1c22" stroke-opacity="0.2" stroke-width="2">
      <line x1="-180" y1="40" x2="180" y2="40" />
      <line x1="-180" y1="70" x2="180" y2="70" />
      <line x1="-180" y1="100" x2="180" y2="100" />
      <line x1="-180" y1="130" x2="180" y2="130" />
    </g>

    <!-- Snap-Fit Locking Core Pins & Lifters -->
    <rect x="-200" y="155" width="24" height="12" rx="2" fill="#E03A2B" />
    <rect x="176" y="155" width="24" height="12" rx="2" fill="#E03A2B" />
    <rect x="-200" y="-155" width="24" height="12" rx="2" fill="#E03A2B" />
    <rect x="176" y="-155" width="24" height="12" rx="2" fill="#E03A2B" />

    <!-- Coordinate Measurement Caliper Mark -->
    <line x1="-280" y1="-180" x2="-280" y2="200" stroke="#E03A2B" stroke-opacity="0.5" stroke-width="1" />
    <polyline points="-276,-175 -280,-180 -284,-175" fill="none" stroke="#E03A2B" stroke-width="1" />
    <polyline points="-276,195 -280,200 -284,195" fill="none" stroke="#E03A2B" stroke-width="1" />
    <text x="-295" y="15" text-anchor="middle" fill="#E03A2B" font-family="monospace" font-size="11" transform="rotate(-90 -295 15)">380.00 mm</text>
  </g>

  <!-- Technical Spec HUD Panel (Bottom) -->
  <g transform="translate(50, 840)">
    <rect x="0" y="0" width="700" height="90" rx="10" fill="#ffffff" fill-opacity="0.85" stroke="#000000" stroke-opacity="0.08" stroke-width="1" />
    <text x="24" y="32" fill="#0b0b0c" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">High-Gloss Aesthetic &amp; Structural Tooling</text>
    <text x="24" y="56" fill="#6b6b70" font-family="monospace" font-size="12">APPLICATIONS: Refrigerator Door Caps, Washing Machine Tubs, Air Conditioner Bezels</text>
    <text x="24" y="74" fill="#E03A2B" font-family="monospace" font-size="11">SURFACE FINISH: SPI A1 (DIAMOND BUFF) // RA &lt; 0.05 µm</text>
  </g>
</svg>